name: Continuous Integration

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 12
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
          components: clippy
      - uses: jdx/mr-boxington-action@v1
      - name: install_dependencies
        run: |
          sudo add-apt-repository -y "deb http://archive.ubuntu.com/ubuntu `lsb_release -sc` main universe restricted multiverse"
          sudo apt-get update -y -qq
          sudo apt-get install libsdl2-dev
      - name: build fixtures
        run: cd fixtures && make
      - name: clippy
        # Lint levels (deny clippy::all + clippy::pedantic, warn on nursery) are
        # configured in Cargo.toml's [lints] table, so any all/pedantic finding
        # fails the build. --all-targets also lints the test code.
        run: mbx clippy --all-targets
      - name: test
        run: mbx test
