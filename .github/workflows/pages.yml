name: Deploy web debugger to GitHub Pages

# Builds the WASM package with wasm-pack and publishes `web/` (with the
# generated `web/pkg/`) to GitHub Pages. The page is served at the repo's
# Pages URL; `web/index.html` loads `./pkg/rgba.js` relatively, so the
# directory can be hosted as-is.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; let in-progress runs finish so a production
# deploy is never cancelled halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-wasm-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: build wasm
        run: wasm-pack build --target web --out-dir web/pkg --no-typescript --release
      - name: checkout r2 (Linux on the GBA)
        uses: actions/checkout@v4
        with:
          repository: bokuweb/r2
          # gba-port branch; pinned so the deployed ROM matches roms.json.
          ref: 2907abd3b34bb4753a2dc3a2c9afbb3f27109316
          path: r2
      - name: build Linux ROM (r2-gba)
        # r2/gba/rust-toolchain.toml selects nightly + rust-src (build-std);
        # the Makefile needs llvm-objcopy from llvm-tools.
        working-directory: r2/gba
        run: |
          rustup component add llvm-tools
          make
          mkdir -p ../../web/roms
          cp target/r2-gba.gba ../../web/roms/r2-linux.gba
      - name: fetch ROM library
        # Downloads the open-source ROMs listed in web/roms.json (pinned by
        # sha256) and copies the in-repo fixtures into web/roms/.
        run: python3 web/fetch-roms.py
      - name: assemble site
        # Ship only what the page needs: the static frontend, wasm package and
        # ROM library. static-server.js / fetch-roms.py are dev helpers.
        run: |
          mkdir -p dist
          cp web/index.html web/app.js web/vram.js web/play.html web/play.js web/audio-processor.js web/roms.json dist/
          cp -r web/pkg dist/pkg
          cp -r web/roms dist/roms
          # /linux/: the play page pinned to the r2-gba Linux ROM.
          python3 web/make-linux-page.py dist/linux
          rm -f dist/pkg/.gitignore dist/pkg/package.json
          touch dist/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          # Create the Pages site (source = GitHub Actions) on first run.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
